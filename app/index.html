<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nid</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="stage">
      <div id="robot">
        <div id="robot-body">
          <div class="eye" id="eye-left"></div>
          <div class="eye" id="eye-right"></div>
          <div id="mouth"></div>
        </div>
        <div id="feet">
          <div class="foot"></div>
          <div class="foot"></div>
        </div>
      </div>
      <div id="speech-bubble" class="hidden">Salut ! 🐣</div>
      <div id="chat-bar">
        <input id="chat-input" placeholder="Parle à Nid..." autocomplete="off" />
        <button id="chat-mic" title="Parler">🎤</button>
        <button id="chat-send">➤</button>
      </div>
    </div>
  </body>
</html>
