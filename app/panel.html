<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oz — Administration</title>
    <link rel="stylesheet" href="/src/panel.css" />
    <script type="module" src="/src/panel.ts" defer></script>
  </head>
  <body>
    <aside id="sidebar">
      <div class="brand">
        <span class="egg-logo" aria-hidden="true"><i></i><i></i></span>
        <div>
          <h1>Oz</h1>
          <span class="subtitle">Compagnon de bureau</span>
        </div>
      </div>

      <nav id="tabs" role="tablist" aria-label="Sections">
        <div class="nav-group">Oz</div>
        <button data-tab="chat" class="active" role="tab">
          <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
          <span>Conversation</span>
        </button>
        <button data-tab="settings" role="tab">
          <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
          <span>Réglages</span>
        </button>
        <button data-tab="memory" role="tab">
          <svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6c0 2.2 1.2 3.6 2 4.5.6.7 1 1.5 1 2.5h6c0-1 .4-1.8 1-2.5.8-.9 2-2.3 2-4.5a6 6 0 0 0-6-6zM9.5 19h5M10.5 21.5h3"/></svg>
          <span>Mémoire</span>
        </button>

        <div class="nav-group">Confiance</div>
        <button data-tab="perms" role="tab">
          <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
          <span>Permissions</span>
        </button>
        <button data-tab="zones" role="tab">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9l8 6M16 9l-8 6"/></svg>
          <span>Zones</span>
        </button>
        <button data-tab="journal" role="tab">
          <svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
          <span>Activité</span>
        </button>

        <div class="nav-group">Système</div>
        <button data-tab="brain" role="tab">
          <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>
          <span>Modèles</span>
        </button>
      </nav>

      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>

    <main id="content"></main>
  </body>
</html>
